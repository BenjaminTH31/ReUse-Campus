
<header class="navbar">
  <a routerLink="/" class="logo">ReUse Campus</a>

  <nav>
    <a routerLink="/">Inicio</a>
    <a routerLink="/publicaciones">Publicaciones</a>

    @if (usuario$ | async; as usuario) {
      <span class="saludo">Hola, {{ usuario.nombre }}</span>
      <button class="btn-nav" (click)="cerrarSesion()">Cerrar sesión</button>
    } @else {
      <a routerLink="/login">Iniciar sesión</a>
      <a routerLink="/registro" class="btn-nav">Registrarse</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer>
  <p>ReUse Campus · Comunidad universitaria sostenible</p>
</footer>
